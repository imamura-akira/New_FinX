<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  :root{--bg:#F6F5FC;--ink:#1B1830;--sub:#7A7490;--primary:#6C5BF5;--up:#16A34A;
    --grad:linear-gradient(100deg,#7D4DF0,#A944D8 55%,#D63AA8);}
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC",sans-serif;}
  body{width:390px;background:var(--bg);color:var(--ink);}
  .p{padding:12px 16px 20px;}
  .hd{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px;}
  .hd b{font-size:21px;font-weight:800;}
  .hd .r{display:flex;align-items:center;gap:9px;}
  .xp{display:flex;align-items:center;gap:5px;border:1.5px solid #E7B9E2;background:#fff;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--primary);}
  .ava{width:36px;height:36px;border-radius:50%;border:2px solid var(--primary);overflow:hidden;}
  .ava img{width:100%;height:100%;object-fit:cover;}
  .hero img{width:100%;display:block;filter:drop-shadow(0 10px 22px rgba(108,91,245,.25));}
  .mrow{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 10px;}
  .mrow b{font-size:15.5px;font-weight:800;}
  .mrow span{font-size:11.5px;color:var(--sub);font-weight:700;}
  .mi{display:flex;align-items:center;gap:11px;background:#fff;border-radius:15px;padding:12px 13px;margin-bottom:9px;box-shadow:0 4px 12px rgba(27,24,48,.05);}
  .mi.done{background:#EDF9F1;}
  .ck{width:26px;height:26px;border-radius:50%;border:2.5px solid #C9C2E8;flex:none;}
  .ck.on{border:none;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;}
  .mi .t{flex:1;}
  .mi .t b{font-size:13.5px;font-weight:800;display:block;}
  .mi .t span{font-size:11px;color:var(--sub);font-weight:600;margin-top:2px;display:block;}
  .xpb{font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 11px;flex:none;}
  .xg{background:#E4F6EA;color:var(--up);}
  .xpu{background:#EFEBFE;color:var(--primary);}
  .chev{color:#C9C2E0;font-size:14px;font-weight:800;}
  /* 连续打卡 */
  .streak{display:flex;align-items:center;gap:12px;background:#fff;border-radius:16px;padding:13px 14px;margin:5px 0 14px;box-shadow:0 4px 12px rgba(27,24,48,.05);}
  .fire{width:40px;height:40px;border-radius:12px;background:#FDEDE4;display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;}
  .streak .t b{font-size:16px;font-weight:800;}
  .streak .t span{font-size:11px;color:var(--sub);font-weight:600;display:block;margin-top:1px;}
  .week{margin-left:auto;display:flex;gap:5px;}
  .d{display:flex;flex-direction:column;align-items:center;gap:3px;}
  .dc{width:19px;height:19px;border-radius:50%;background:var(--primary);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;}
  .d span{font-size:8.5px;color:var(--sub);font-weight:700;}
  .cta{background:var(--grad);color:#fff;text-align:center;border-radius:999px;padding:14px 0;font-size:15px;font-weight:800;box-shadow:0 10px 22px rgba(125,77,240,.32);}
</style>
</head>
<body>
<div class="p">
  <div class="hd"><b>Fifi 奖励任务</b><div class="r"><div class="xp">&#11088; 1,493 XP</div><div class="ava"><img src="assets/fifi_avatar.png"></div></div></div>

  <div class="hero"><img src="assets/xp_hero.png"></div>

  <div class="mrow"><b>今日任务</b><span>12:18:45 后重置 &#9201;</span></div>

  <div class="mi done"><div class="ck on">&#10003;</div><div class="t"><b>1. 每日签到</b><span>保持你的连续记录</span></div><span class="xpb xg">+10 XP</span><span class="chev">&#8250;</span></div>
  <div class="mi"><div class="ck"></div><div class="t"><b>2. 跟 Fifi 学一课</b><span>完成一节市场小课堂</span></div><span class="xpb xpu">+30 XP</span><span class="chev">&#8250;</span></div>
  <div class="mi"><div class="ck"></div><div class="t"><b>3. 运行持仓体检</b><span>检查你的资金健康度</span></div><span class="xpb xpu">+20 XP</span><span class="chev">&#8250;</span></div>
  <div class="mi"><div class="ck"></div><div class="t"><b>4. 本月储蓄目标</b><span>完成本月入金小目标</span></div><span class="xpb xpu">+80 XP</span><span class="chev">&#8250;</span></div>
  <div class="mi"><div class="ck"></div><div class="t"><b>5. 分享一次 FinX</b><span>邀请一位朋友一起学习</span></div><span class="xpb xpu">+20 XP</span><span class="chev">&#8250;</span></div>

  <div class="streak">
    <div class="fire">&#128293;</div>
    <div class="t"><b>连续 50 天</b><span>继续保持!</span></div>
    <div class="week">
      <div class="d"><div class="dc">&#10003;</div><span>一</span></div>
      <div class="d"><div class="dc">&#10003;</div><span>二</span></div>
      <div class="d"><div class="dc">&#10003;</div><span>三</span></div>
      <div class="d"><div class="dc">&#10003;</div><span>四</span></div>
      <div class="d"><div class="dc">&#10003;</div><span>五</span></div>
      <div class="d"><div class="dc">&#10003;</div><span>六</span></div>
      <div class="d"><div class="dc" style="background:#fff;border:2px solid var(--primary);color:var(--primary);">&#10003;</div><span>日</span></div>
    </div>
  </div>

  <div class="cta">&#128092; 前往 Fifi 衣橱</div>
</div>
</body>
</html>
