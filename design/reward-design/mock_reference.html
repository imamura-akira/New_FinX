<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390">
<style>
  :root{
    --bg:#F6F5FC; --primary:#6C5BF5; --ink:#1B1830; --sub:#7A7490;
    --gold:#E9C878; --gold-d:#C9A14E;
    --grad:linear-gradient(100deg,#5A57EE 0%,#A944D8 55%,#D63AA8 100%);
    --grad-soft:linear-gradient(135deg,#7D4DF0,#C13AC8);
    --card:#fff; --r:20px;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;}
  body{width:390px;background:var(--bg);color:var(--ink);}
  body::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(2px 2px at 40px 760px,#DED8F2 50%,transparent 51%),
      radial-gradient(2.5px 2.5px at 330px 900px,#E3DDF5 50%,transparent 51%),
      radial-gradient(2px 2px at 90px 1180px,#DED8F2 50%,transparent 51%),
      radial-gradient(2px 2px at 300px 1420px,#E3DDF5 50%,transparent 51%),
      radial-gradient(2.5px 2.5px at 60px 1680px,#DED8F2 50%,transparent 51%),
      radial-gradient(2px 2px at 340px 1860px,#E3DDF5 50%,transparent 51%);}
  .device{width:390px;padding:14px 16px 0;position:relative;}
  .status{display:flex;justify-content:space-between;font-size:13px;font-weight:600;padding:2px 6px 10px;}
  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .hd h1{font-size:25px;font-weight:800;letter-spacing:.5px;}
  .hd .right{display:flex;align-items:center;gap:10px;}
  .xp{display:flex;align-items:center;gap:6px;border:1.5px solid #D9D4F7;background:#fff;border-radius:999px;padding:7px 14px;font-size:14px;font-weight:700;color:var(--primary);}
  .xp .g{color:var(--gold-d);}
  .ava{width:38px;height:38px;border-radius:50%;border:2px solid var(--primary);overflow:hidden;background:#EDE9FF;}
  .ava img{width:100%;height:100%;object-fit:cover;}
  /* hero */
  .hero{position:relative;border-radius:24px;padding:24px 20px 20px;color:#241F4E;overflow:hidden;
    background:linear-gradient(135deg,#F2EDFC 0%,#F7F2FC 55%,#F6EBF7 100%);
    border:1px solid #E7E0F7;box-shadow:0 16px 36px rgba(108,91,245,.16);}
  .hero .glow{position:absolute;border-radius:50%;filter:blur(26px);opacity:.5;pointer-events:none;}
  .hero .snow{position:absolute;background:#C9B9F2;border-radius:50%;opacity:.9;pointer-events:none;}
  .hero .star{position:absolute;color:var(--gold-d);pointer-events:none;}
  /* string lights */
  .lights{position:absolute;top:0;left:0;width:100%;height:46px;pointer-events:none;}
  .badge{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid #D4B46A;color:#9A7524;border-radius:999px;padding:5px 12px;font-size:11.5px;font-weight:700;letter-spacing:2px;background:rgba(233,200,120,.14);}
  .hero h2{position:relative;font-size:25px;font-weight:800;line-height:1.32;margin-top:12px;}
  .hero h2 .thin{font-weight:600;opacity:.9;}
  .hero p{position:relative;margin-top:10px;font-size:13px;line-height:1.7;color:#5F5880;max-width:184px;}
  .hero .cta{position:relative;display:inline-flex;align-items:center;gap:7px;margin-top:16px;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:700;color:#2E2752;background:linear-gradient(135deg,#F6E7BF,#E9C878);box-shadow:0 6px 16px rgba(233,200,120,.35);}
  .hero img.cat{position:absolute;right:-4px;bottom:-4px;height:226px;filter:drop-shadow(0 12px 20px rgba(0,0,0,.35));}
  .hat{position:absolute;pointer-events:none;}
  .hero .ground{position:absolute;left:0;right:0;bottom:0;height:26px;background:linear-gradient(to top,rgba(255,255,255,.22),transparent);}
  /* chips */
  .chips{display:flex;gap:6px;margin:18px 0 20px;position:relative;}
  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;border-radius:999px;padding:8px 11px;font-size:12.5px;font-weight:700;background:#fff;border:1.5px solid #E4E0F5;color:var(--sub);}
  .chip .lock{font-size:10px;}
  .chip.on{background:var(--grad-soft);border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(125,77,240,.32);}
  .lock{font-size:11px;opacity:.7;}
  /* section */
  .sec{position:relative;display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;}
  .sec b{font-size:19px;font-weight:800;letter-spacing:.3px;}
  .sec span{font-size:12px;color:var(--sub);font-weight:600;}
  .sec .flake{color:var(--primary);font-size:15px;}
  .grid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .item{background:var(--card);border-radius:var(--r);padding:16px 12px 14px;position:relative;
    box-shadow:0 10px 24px rgba(27,24,48,.07);border:1px solid #EFECFA;}
  .item::after{content:"";position:absolute;inset:0;border-radius:var(--r);padding:1px;
    background:linear-gradient(135deg,rgba(125,77,240,.35),rgba(233,200,120,.4) 60%,rgba(214,58,168,.3));
    -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;}
  .item .lk{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;background:#F3F0FC;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--sub);z-index:2;}
  .pic{height:96px;display:flex;align-items:center;justify-content:center;border-radius:14px;
    background:radial-gradient(60% 70% at 50% 46%,#F1EDFF 0%,#FAF8FF 70%,transparent 100%);}
  .pic svg{height:82px;}
  .item .nm{text-align:center;font-size:14.5px;font-weight:700;margin-top:9px;}
  .item .xpv{display:flex;align-items:center;justify-content:center;gap:5px;font-size:13.5px;font-weight:800;color:var(--primary);margin-top:5px;}
  .item .xpv .st8{color:var(--gold-d);}
  .item .st{margin:9px auto 0;width:fit-content;background:#F1EFFA;color:var(--sub);font-size:11.5px;font-weight:600;border-radius:999px;padding:4px 12px;}
  /* dream cards */
  .dgrid{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px;}
  .dcard{border-radius:var(--r);overflow:hidden;position:relative;color:#fff;
    background:linear-gradient(150deg,#332B66 0%,#5F43C9 55%,#9A3FC9 100%);
    box-shadow:0 12px 26px rgba(51,43,102,.3);}
  .dcard .snowc{position:absolute;background:#fff;border-radius:50%;opacity:.7;}
  .dcard .img{height:88px;display:flex;align-items:center;justify-content:center;}
  .dcard .img svg{height:60px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.3));}
  .dcard .lk{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;}
  .dcard .nm{text-align:center;font-size:14px;font-weight:700;}
  .dcard .lv{text-align:center;font-size:12px;font-weight:700;color:var(--gold);margin:4px 0 14px;letter-spacing:1px;}
  /* notify */
  .notify{position:relative;background:var(--grad);color:#fff;text-align:center;border-radius:999px;padding:16px 0;font-size:16px;font-weight:800;box-shadow:0 12px 26px rgba(125,77,240,.35);letter-spacing:1px;}
  .note{text-align:center;font-size:11px;color:#A7A1BC;margin:10px 0 18px;}
  /* tabbar */
  .tabbar{width:390px;background:#fff;border-top:1px solid #EEEAF8;display:flex;padding:10px 0 18px;}
  .tab{flex:1;text-align:center;font-size:11.5px;color:#B5AFC9;font-weight:600;}
  .tab .ic{display:block;margin:0 auto 3px;width:22px;height:22px;}
  .tab.on{color:var(--primary);}
</style>
</head>
