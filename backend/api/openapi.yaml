openapi: 3.0.3
info:
  title: 美股交易 App 后端接口
  version: "1.0.0"
  description: |
    App ↔ 我方后端接口契约 v1，依据 design/api-spec.md（已冻结）。
    - App 只调用本后端，绝不直接调用 DriveWealth（DW）。
    - 所有响应为 `{"code":0,"message":"ok","data":{...}}` 包装；错误码见 components.schemas.ErrorCode。
    - 时间一律 ISO-8601 UTC；金额单位 USD。
    - 标注【Q-DW-x】的字段/行为依赖 DW 答复，后端走配置开关（backend-design.md 第 7 节）。
    - 本文件与 api-spec.md 必须同步修改；破坏性变更升 /api/v2（需用户同意）。
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: auth
    description: 认证（F1，P-01/P-02）
  - name: application
    description: 开户申请（F2–F5，P-03–P-06、P-30、P-34–P-36）
  - name: account
    description: 账户（F6，P-06/P-08/S-01）
  - name: bank-accounts
    description: 银行账户（F7，P-31/P-32）
  - name: funding
    description: 出入金（F8/F9，P-13/P-14/P-33/P-18）
  - name: trading
    description: 交易（F14，P-19 / P-11 / P-12；v1 新增，向后兼容）
  - name: paper
    description: 模拟交易 / 模拟盘（F15，演示与练习用途；不调用 DW）
  - name: documents
    description: 文件（F10，P-15）
  - name: notifications
    description: 通知（F10，P-17）
  - name: rewards
    description: 奖励 / XP（F22-e Fifi 商店、F22-f 赚取 XP 任务，演示）

paths:
  # ───────────── 1. 认证 ─────────────
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: 发送邮箱验证码（限频）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: 已发送
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [ttl, resendAfter]
                        properties:
                          ttl: { type: integer, description: 验证码有效期（秒） }
                          resendAfter: { type: integer, description: 多少秒后可重发 }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: 校验验证码（登录 / 注册合一）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email: { type: string, format: email }
                code: { type: string, pattern: "^[0-9]{6}$" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sessionToken, isNewUser]
                        properties:
                          sessionToken: { type: string }
                          isNewUser: { type: boolean }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /auth/oauth:
    post:
      tags: [auth]
      operationId: oauthLogin
      summary: Google / Apple 登录（阶段 1.5）
      description: 提供 Google 登录时必须同时提供 Apple 登录。Apple 返回中转邮箱时 emailIsRelay=true【Q-DW-6b】。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, idToken]
              properties:
                provider: { type: string, enum: [GOOGLE, APPLE] }
                idToken: { type: string }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [sessionToken, isNewUser, emailIsRelay]
                        properties:
                          sessionToken: { type: string }
                          isNewUser: { type: boolean }
                          emailIsRelay: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "501": { $ref: "#/components/responses/NotEnabled" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 注销会话
      responses:
        "200": { $ref: "#/components/responses/OkEmpty" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 启动时获取全局状态
      responses:
        "200":
          description: 当前用户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [email, loginProvider, accountStatus]
                        properties:
                          email: { type: string, format: email }
                          loginProvider: { $ref: "#/components/schemas/LoginProvider" }
                          applicationId: { type: string, nullable: true }
                          accountStatus: { $ref: "#/components/schemas/ApplicationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────── 2. 开户申请 ─────────────
  /application:
    get:
      tags: [application]
      operationId: getApplication
      summary: 获取开户申请（草稿与状态）
      responses:
        "200":
          description: 开户申请
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [status]
                        properties:
                          applicationId: { type: string, nullable: true }
                          status: { $ref: "#/components/schemas/ApplicationStatus" }
                          step: { type: string, nullable: true, description: 当前子步骤（如 a–g、p04、p05、p30） }
                          data: { $ref: "#/components/schemas/ApplicationData" }
                          disclosures:
                            type: array
                            items: { $ref: "#/components/schemas/DisclosureAck" }
                          kyc:
                            type: object
                            nullable: true
                            properties:
                              status: { $ref: "#/components/schemas/KycStatus" }
                              updatedAt: { type: string, format: date-time, nullable: true }
                          documents:
                            type: array
                            description: 已暂存的证件（不含影像），供 P-04 断点续填与 P-30 汇总（新增字段）
                            items:
                              type: object
                              properties:
                                documentId: { type: string }
                                docType: { type: string }
                                side: { type: string, enum: [FRONT, BACK] }
                                uploadedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /application/draft:
    put:
      tags: [application]
      operationId: saveApplicationDraft
      summary: 自动保存草稿
      description: 字段名与 pages.md P-03 数据字段一致；提交后不可修改（补资料走 /application/remediate）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [step, data]
              properties:
                step: { type: string }
                data: { $ref: "#/components/schemas/ApplicationData" }
      responses:
        "200":
          description: 已保存
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [savedAt]
                        properties:
                          savedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /application/documents:
    post:
      tags: [application]
      operationId: uploadApplicationDocument
      summary: 上传证件（P-04 / P-35）
      description: 后端转 DW `POST /documents`（待沙盒验证）。影像加密存储。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [docType, side, image]
              properties:
                docType: { type: string, description: 如 PASSPORT / DRIVER_LICENSE / NATIONAL_ID_CARD / RESIDENCE_PERMIT（以 DW 支持为准） }
                side: { type: string, enum: [FRONT, BACK] }
                image: { type: string, format: byte, description: base64 编码的影像 }
      responses:
        "200":
          description: 已上传
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [documentId]
                        properties:
                          documentId: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  /application/submit:
    post:
      tags: [application]
      operationId: submitApplication
      summary: 提交开户申请
      description: |
        后端编排：`POST /users`（BASIC/IDENTIFICATION/PERSONAL/ADDRESS_INFO）→ `PATCH /users/{userID}`（其余 documents）【Q-DW-3】→ 证件上传。
        DW username/password 由后端生成【Q-DW-4】。重复提交返回 40901。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signatureName, disclosures]
              properties:
                signatureName: { type: string, description: 须与法定姓名一致 }
                disclosures:
                  type: array
                  items: { $ref: "#/components/schemas/DisclosureAck" }
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [applicationRef, submittedAt]
                        properties:
                          applicationRef: { type: string }
                          submittedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  /application/status:
    get:
      tags: [application]
      operationId: getApplicationStatus
      summary: 开户进度（P-06 轮询）
      description: KYC 非终态时 App 每 5–10 秒轮询；后端由 SQS 事件驱动更新，轮询 DW 仅用于对账。
      responses:
        "200":
          description: 当前进度
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [kycStatus]
                        properties:
                          kycStatus: { $ref: "#/components/schemas/KycStatus" }
                          kycUpdatedAt: { type: string, format: date-time, nullable: true }
                          issues:
                            type: array
                            items:
                              type: object
                              required: [code, userMessage]
                              properties:
                                code: { type: string }
                                field: { type: string, nullable: true }
                                userMessage: { type: string }
                          requiredDocs:
                            type: array
                            items:
                              type: object
                              properties:
                                type: { type: string }
                                sides:
                                  type: array
                                  items: { type: string, enum: [FRONT, BACK] }
                                reason: { type: string }
                          accountStatus:
                            allOf: [{ $ref: "#/components/schemas/AccountStatus" }]
                            nullable: true
                          accountNo: { type: string, nullable: true }
                          applicationRef: { type: string, nullable: true, description: 申请参考号（新增字段） }
                          submittedAt: { type: string, format: date-time, nullable: true, description: 提交时间（新增字段） }
                          submitState:
                            type: string
                            enum: [NOT_SUBMITTED, SUBMITTING, SUBMITTED, NEEDS_ATTENTION]
                            description: |
                              我方提交给 DW 的进度（新增字段）。DW User 创建前 kycStatus 保持 KYC_NOT_READY，
                              由本字段区分"草稿"与"正在提交"；NEEDS_ATTENTION 表示 DW 拒绝了请求，需人工处理。
        "401": { $ref: "#/components/responses/Unauthorized" }

  /application/remediate:
    patch:
      tags: [application]
      operationId: remediateApplication
      summary: 补充开户资料（P-34）
      description: 后端 `PATCH /users/{userID}`，DW 重跑 KYC。仅 kycStatus=KYC_INFO_REQUIRED 时允许，否则 40901。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fields]
              properties:
                fields:
                  type: object
                  additionalProperties: true
                  description: 只包含被标记的字段，字段名与 P-03 数据字段一致
      responses:
        "200":
          description: 已重新提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [resubmittedAt]
                        properties:
                          resubmittedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  # ───────────── 3. 账户 ─────────────
  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: 交易账户
      responses:
        "200":
          description: 账户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [accountId, status, accountType, tradingType, managementType]
                        properties:
                          accountId: { type: string }
                          accountNo: { type: string, nullable: true }
                          status: { $ref: "#/components/schemas/AccountStatus" }
                          accountType: { type: string, enum: [LIVE] }
                          tradingType: { type: string, enum: [CASH] }
                          managementType: { type: string, enum: [SELF] }
                          openedAt: { type: string, format: date-time, nullable: true }
                          dw:
                            type: object
                            description: 仅演示环境（OTP_DEV_LOG=true）返回，供 App"DW 沙盒凭证"区与 DW 当场对照；生产不返回。
                            properties:
                              userId: { type: string }
                              accountId: { type: string }
                              accountNo: { type: string }
                              kycStatus: { type: string }
                              syncedAt: { type: string, format: date-time, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" } # 账户尚未开立（40901，与 api-spec 第 10 节、实现一致；审计 DOC-P1-1）

  /account/money:
    get:
      tags: [account]
      operationId: getAccountMoney
      summary: 资金汇总
      description: 来自 DW 账户资金汇总【Q-DW-8d 复核字段名】。**可提现一律用 DW 返回的 cashAvailableForWithdrawal。**
      responses:
        "200":
          description: 资金汇总
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [cash, settledCash, buyingPower, cashAvailableForWithdrawal, unsettled, updatedAt]
                        properties:
                          cash: { $ref: "#/components/schemas/Money" }
                          settledCash: { $ref: "#/components/schemas/Money" }
                          buyingPower: { $ref: "#/components/schemas/Money" }
                          cashAvailableForWithdrawal: { $ref: "#/components/schemas/Money" }
                          unsettled: { $ref: "#/components/schemas/Money" }
                          pendingDeposits:
                            allOf: [{ $ref: "#/components/schemas/Money" }]
                            description: 尚未计入购买力的在途入金（DW payments.buyingPower.pendingDepositsAmountNotAvailable；新增字段）
                          withheldForSeasoning:
                            allOf: [{ $ref: "#/components/schemas/Money" }]
                            description: 因入金观察期未计入可提现的金额（DW payments.redemptions.amountWithheldFromRedemptions；新增字段）
                          updatedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502": { $ref: "#/components/responses/DWError" }

  /account/allocation:
    get:
      tags: [account]
      operationId: getAccountAllocation
      summary: 资产分布（P-07；F17）
      description: |
        数据来源：DW summary/money 的 cash.cashBalance（现金）与 summary/positions 的 marketValue（持仓市值）；持仓按我方标的列表的 STOCK / ETF 分类归堆（列表外代码按股票计）。
        总资产 = 现金 + 股票市值 + ETF 市值；占比由后端计算（一位小数，合计 100.0；总额为 0 时全为 0）。条目固定顺序 STOCK、ETF、CASH，金额为 0 的类别照常返回。
        当日首次请求时若尚无快照，顺带记录当日兜底快照（见 history）。新增接口，向后兼容。
      responses:
        "200":
          description: 资产分布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Allocation" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/DWError" }

  /account/history:
    get:
      tags: [account]
      operationId: getAccountHistory
      summary: 资产趋势（P-07；每日资产快照；F17）
      description: |
        每日资产快照，每个用户 × 账户类型 × 美东日期一条：收盘后（美东 16:10 起）记录 CLOSE 快照；当日首次请求分布或趋势时若尚无记录，兜底写入一条，
        之后的收盘快照覆盖它。有几天返回几天，不补造历史；快照少于 2 个时 App 显示"记录积累中"。快照为内部记录，金额以 DW / 模拟账户返回为基础。
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [1D, 1W, 3M, 1Y, YTD, 7D, 30D, 90D, ALL], default: 7D }
          description: |
            7D / 30D / 90D 为含今日的最近 N 个美东自然日；ALL 为全部。
            F22-a 新增（向后兼容）：1W = 7 天、3M = 90 天、1Y = 365 天、YTD = 当年 1 月 1 日（美东）起；
            1D = 日内快照（美东交易日 09:30–16:00 每 30 分钟一档），返回最近一个有日内快照的美东日期的各档，点带 at
      responses:
        "200":
          description: 资产趋势
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssetHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/DWError" }
        "422": { $ref: "#/components/responses/ValidationError" }

  # ───────────── 4. 银行账户 ─────────────
  /funding/bank-accounts:
    get:
      tags: [bank-accounts]
      operationId: listBankAccounts
      summary: 已绑定银行账户
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/BankAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [bank-accounts]
      operationId: linkBankAccount
      summary: 绑定银行账户【Q-DW-2 二选一】
      description: |
        方案 A（DIRECT，已核实）：直接录入账号与路由号，后端转 DW `POST /back-office/bank-accounts`。
        方案 B（PLAID）：Plaid processor token。由配置 bank_link_method 决定接受哪一种；答复后删除未选方案。
        账号全文不落库（只存 DW id + 尾号）。超过绑定上限返回 40901。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/BankLinkDirect"
                - $ref: "#/components/schemas/BankLinkPlaid"
      responses:
        "200":
          description: 已提交绑定
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [id, status]
                        properties:
                          id: { type: string }
                          status: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  /funding/bank-accounts/{id}:
    delete:
      tags: [bank-accounts]
      operationId: unlinkBankAccount
      summary: 解绑银行账户
      description: 有在途入金 / 出金时返回 40901。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkEmpty" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  # ───────────── 5. 出入金 ─────────────
  /funding/deposit-instructions:
    get:
      tags: [funding]
      operationId: getDepositInstructions
      summary: 电汇入金指引（P-33）
      description: 后端转 DW `GET /accounts/{id}/funding/deposit-instructions`（待沙盒验证）；reference 必含账户号 + 姓名。
      responses:
        "200":
          description: 电汇收款信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [beneficiaryName, bankName, accountNumber, reference]
                        properties:
                          beneficiaryName: { type: string }
                          bankName: { type: string }
                          bankAddress: { type: string }
                          accountNumber: { type: string }
                          routingNumber: { type: string }
                          swift: { type: string }
                          reference: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "502": { $ref: "#/components/responses/DWError" }

  /funding/deposits:
    post:
      tags: [funding]
      operationId: createDeposit
      summary: ACH 入金（P-13）
      description: 后端转 DW `POST /back-office/funding/deposits`（type=ACH，已核实）。限额走后端配置 limits.*，超限返回 42201 并带限额。写操作不自动重试。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bankAccountId, amount]
              properties:
                bankAccountId: { type: string }
                amount: { $ref: "#/components/schemas/Money" }
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [transferId, status]
                        properties:
                          transferId: { type: string }
                          status: { $ref: "#/components/schemas/DepositStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  /funding/withdrawals:
    post:
      tags: [funding]
      operationId: createWithdrawal
      summary: 出金（P-14）
      description: |
        后端转 DW `POST /funding/redemptions`【Q-DW-8d 字段待核】。
        WIRE 收款人固定为开户姓名，后端强制，不接受客户端传入；金额与限额后端二次校验；可提现以 DW 返回为准。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount]
              properties:
                method: { type: string, enum: [ACH, WIRE] }
                amount: { $ref: "#/components/schemas/Money" }
                bankAccountId: { type: string, description: method=ACH 时必填 }
                wire:
                  type: object
                  description: method=WIRE 时必填
                  required: [bankName, accountNumber, swiftOrAba, country]
                  properties:
                    bankName: { type: string }
                    accountNumber: { type: string }
                    swiftOrAba: { type: string }
                    country: { type: string, description: ISO 3166-1 alpha-2 }
                    intermediarySwift: { type: string }
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [transferId, status]
                        properties:
                          transferId: { type: string }
                          status: { type: string, description: 出金状态枚举待 Q-DW-8d }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }

  /funding/transfers:
    get:
      tags: [funding]
      operationId: listTransfers
      summary: 出入金记录（P-18 时间线）
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [DEPOSIT, WITHDRAWAL] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Transfer" }
          headers:
            X-Next-Cursor:
              description: 还有更多记录时返回，作为下一页的 cursor 参数（每页 50 条；新增）
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /funding/limits:
    get:
      tags: [funding]
      operationId: getFundingLimits
      summary: 出入金限额与观察期（P-13 / P-14 前置校验与文案；新增，2026-11-21）
      description: >-
        取自后端配置 limits.* 与 seasoning_*（Q-DW-8 / 8e 待 DW 确认的取值）。App 据此做前置校验与文案，不再写死；
        后端仍对每笔申请强制校验。可提现日以 DW 返回为准，seasoningDays 仅用于无返回值时的说明文案。
      responses:
        "200":
          description: 限额与观察期
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/FundingLimits" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────── 5.5 市场数据（F11，虚拟行情） ─────────────
  /market/quotes:
    get:
      tags: [market]
      operationId: getQuotes
      summary: 批量报价（P-07 自选、P-09 列表；虚拟行情）
      description: |
        第一阶段由后端虚拟行情服务提供（随机游走），响应带 simulated=true；接真实行情时只换实现、不改契约。
        App 轮询间隔 3–5 秒。行情为模拟数据、不含用户信息，P-01"先逛逛行情"需未登录可看，故无需登录（api-spec.md 第 10 节）。
      security: []
      parameters:
        - name: symbols
          in: query
          description: 逗号分隔的代码（最多 50 个，大小写不敏感，未知代码忽略）；为空时返回全部标的
          schema: { type: string, example: "AAPL,SPY" }
      responses:
        "200":
          description: 报价
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, ts, quotes]
                        properties:
                          simulated: { type: boolean, description: 虚拟行情时恒为 true }
                          ts: { type: string, format: date-time }
                          quotes:
                            type: array
                            items: { $ref: "#/components/schemas/Quote" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /market/instruments/{symbol}:
    get:
      tags: [market]
      operationId: getInstrument
      summary: 个股详情（P-10；虚拟行情与当日分时）
      security: []
      parameters:
        - name: symbol
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 个股
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, symbol, name, last, chg, chgPct, dayHigh, dayLow, prevClose, candles]
                        properties:
                          simulated: { type: boolean }
                          symbol: { type: string }
                          name: { type: string }
                          exchange: { type: string, description: 新增字段 }
                          type: { type: string, enum: [STOCK, ETF], description: 新增字段 }
                          last: { type: number }
                          chg: { type: number }
                          chgPct: { type: number, description: 涨跌幅（百分数，1.07 表示 +1.07%） }
                          dayHigh: { type: number }
                          dayLow: { type: number }
                          prevClose: { type: number }
                          candles:
                            type: array
                            description: 当日 1 分钟模拟分时（最多 390 根）
                            items:
                              type: object
                              required: [t, o, h, l, c]
                              properties:
                                t: { type: string, format: date-time }
                                o: { type: number }
                                h: { type: number }
                                l: { type: number }
                                c: { type: number }
        "422": { $ref: "#/components/responses/ValidationError" }
  /market/stats:
    get:
      tags: [market]
      operationId: getMarketStats
      summary: 市场统计（P-09；涨跌分布，演示数据；F22-b）
      description: |
        新增接口，向后兼容。统计标的池全部股票与 ETF（虚拟行情）。TODAY = 当前涨跌幅（相对昨收）实时统计；
        30D = 当前价相对 30 个自然日前（含）最近一个每日收盘快照（迁移 000011 instrument_daily_close，美东交易日 16:05 后写入）；
        任一标的缺少基准快照时 insufficient=true、各档为 0（App 显示"数据积累中"），不补造历史。
        9 档自大跌到大涨：>7%、7~5、5~3、3~0、0（|涨跌幅| < 0.005%）、0~3、3~5、5~7、>7%。
      security: []
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, enum: [TODAY, 30D], default: TODAY }
      responses:
        "200":
          description: 涨跌分布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, period, insufficient, buckets, up, down, flat, total, asOf]
                        properties:
                          simulated: { type: boolean, description: 恒为 true（演示数据） }
                          period: { type: string, enum: [TODAY, 30D] }
                          insufficient: { type: boolean, description: 30D 基准快照不足（数据积累中） }
                          since: { type: string, format: date, description: 最早收盘快照日期（仅 30D 不足时） }
                          buckets:
                            type: array
                            description: 9 档，自大跌到大涨
                            items:
                              type: object
                              required: [label, count]
                              properties:
                                label: { type: string }
                                count: { type: integer }
                          up: { type: integer }
                          down: { type: integer }
                          flat: { type: integer }
                          total: { type: integer }
                          asOf: { type: string, format: date-time }
        "422": { $ref: "#/components/responses/ValidationError" }

  /market/sentiment:
    get:
      tags: [market]
      operationId: getMarketSentiment
      summary: 市场情绪（P-09；恐慌贪婪指数 + 涨跌家数，演示数据）
      description: |
        F11 扩展（新增接口，向后兼容）。全部基于虚拟行情：恐慌贪婪指数由涨跌家数、平均涨跌幅、动量与波动四个分量合成并指数平滑（缓慢变化）；
        涨跌家数统计全部虚拟标的，|涨跌幅| < flatThresholdPct 计为平盘。App 每 3 秒轮询。
        恐慌贪婪指数正式数据源待定（自行计算或采购，不得抓取第三方指数）。
      security: []
      responses:
        "200":
          description: 市场情绪
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, ts, fearGreed, breadth]
                        properties:
                          simulated: { type: boolean, description: 恒为 true（演示数据） }
                          ts: { type: string, format: date-time }
                          fearGreed:
                            type: object
                            required: [value, label]
                            properties:
                              value: { type: integer, minimum: 0, maximum: 100 }
                              label:
                                type: string
                                enum: [EXTREME_FEAR, FEAR, NEUTRAL, GREED, EXTREME_GREED]
                                description: 0–24 极度恐慌，25–44 恐慌，45–55 中性，56–75 贪婪，76–100 极度贪婪
                              components:
                                type: object
                                description: 各分量得分（0–100），仅供说明
                                properties:
                                  breadth: { type: number }
                                  change: { type: number }
                                  momentum: { type: number }
                                  volatility: { type: number }
                          breadth:
                            type: object
                            required: [up, down, flat, total]
                            properties:
                              up: { type: integer }
                              down: { type: integer }
                              flat: { type: integer }
                              total: { type: integer }
                              flatThresholdPct: { type: number, description: 平盘阈值（百分数，0.1 表示 ±0.10%） }

  # ───────────── 5.6 交易（F14） ─────────────
  /orders:
    post:
      tags: [trading]
      operationId: createOrder
      summary: 下单（P-19，市价单 / 限价单）
      description: |
        后端转 DW `POST /orders`（附 Idempotency-Key）。MARKET：`amount`（按金额，允许碎股）与 `quantity`（按股数，最多 6 位小数）二选一。
        LIMIT（当日有效）：必须按 `quantity`，`limitPrice` > 0，`timeInForce` 只支持 DAY；买入冻结金额 = quantity × limitPrice；转 DW 字段 price / timeInForce。
        后端强制：买入预估金额 ≤ DW 购买力且 ≥ 单笔最低（LIMIT_MIN_ORDER，示例值 $1）；卖出 ≤ DW 可卖数量。超限 42201（data.limits）；
        OPEN_NO_NEW_TRADES 账户买入 40301；10 秒内重复提交 40901；DW 结果不明 50001（data.orderId）。
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, orderType]
              properties:
                symbol: { type: string, example: AAPL }
                side: { type: string, enum: [BUY, SELL] }
                orderType: { type: string, enum: [MARKET, LIMIT] }
                amount: { $ref: "#/components/schemas/Money" }
                quantity: { type: number, minimum: 0, exclusiveMinimum: true, description: 股数，最多 6 位小数；限价单必填 }
                limitPrice: { type: number, minimum: 0, exclusiveMinimum: true, description: 限价单必填；$1 以上最多两位小数，$1 以下最多四位 }
                timeInForce: { type: string, enum: [DAY], description: 限价单有效期，只支持当日有效（缺省即 DAY） }
      responses:
        "200":
          description: 已提交
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orderId, status]
                        properties:
                          orderId: { type: string }
                          status: { $ref: "#/components/schemas/OrderStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502": { $ref: "#/components/responses/DWError" }
    get:
      tags: [trading]
      operationId: listOrders
      summary: 订单列表（P-11）
      description: 每页 50 条，按提交时间倒序；下一页游标在响应头 X-Next-Cursor。未开户返回空数组。
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
          description: OPEN = SUBMITTING / NEW / PARTIAL_FILL / PENDING_CANCEL / UNCONFIRMED；CLOSED = 其余
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /orders/{id}:
    get:
      tags: [trading]
      operationId: getOrder
      summary: 订单详情（P-11）
      description: 未完结订单查询时向 DW 刷新一次。不存在或不属于当前用户返回 40901。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Order" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /orders/{id}/cancel:
    post:
      tags: [trading]
      operationId: cancelOrder
      summary: 撤单（P-11）
      description: 仅 NEW / PARTIAL_FILL 可撤，否则 40901。后端转 DW `PATCH /orders/{orderID}`（method=CANCEL），返回撤单后 DW 状态（可能为 PENDING_CANCEL）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已提交撤单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orderId, status]
                        properties:
                          orderId: { type: string }
                          status: { $ref: "#/components/schemas/OrderStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Restricted" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/DWError" }

  /positions:
    get:
      tags: [trading]
      operationId: listPositions
      summary: 持仓（P-12）
      description: DW `GET /accounts/{accountID}/summary/positions` 的返回值（数量、成本、市值、盈亏均取 DW）。未开户返回 40901。
      responses:
        "200":
          description: 持仓
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [positions]
                        properties:
                          updatedAt: { type: string, format: date-time, nullable: true }
                          equityValue: { type: number, description: DW equityValue }
                          positions:
                            type: array
                            items: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/DWError" }

  # ───────────── 5.7 模拟交易 / 模拟盘（F15） ─────────────
  /paper/account:
    get:
      tags: [paper]
      operationId: getPaperAccount
      summary: 模拟账户（首次访问自动创建）
      responses:
        "200":
          description: 模拟账户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PaperAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /paper/account/reset:
    post:
      tags: [paper]
      operationId: resetPaperAccount
      summary: 一键重置模拟账户（恢复初始资金，清空持仓与订单）
      responses:
        "200":
          description: 重置后的模拟账户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PaperAccount" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /paper/account/allocation:
    get:
      tags: [paper]
      operationId: getPaperAccountAllocation
      summary: 资产分布（P-07，模拟盘；F17）
      description: |
        数据来源：模拟账户现金与持仓（按虚拟行情估值），不调用 DW；持仓按我方标的列表的 STOCK / ETF 分类归堆（列表外代码按股票计）。
        总资产 = 现金 + 股票市值 + ETF 市值；占比由后端计算（一位小数，合计 100.0；总额为 0 时全为 0）。条目固定顺序 STOCK、ETF、CASH，金额为 0 的类别照常返回。
        当日首次请求时若尚无快照，顺带记录当日兜底快照（见 history）。新增接口，向后兼容。
      responses:
        "200":
          description: 资产分布
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/Allocation" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /paper/account/history:
    get:
      tags: [paper]
      operationId: getPaperAccountHistory
      summary: 资产趋势（P-07，模拟盘；每日资产快照；F17）
      description: |
        每日资产快照，每个用户 × 账户类型 × 美东日期一条：收盘后（美东 16:10 起）记录 CLOSE 快照；当日首次请求分布或趋势时若尚无记录，兜底写入一条，
        之后的收盘快照覆盖它。有几天返回几天，不补造历史；快照少于 2 个时 App 显示"记录积累中"。快照为内部记录，金额以 DW / 模拟账户返回为基础。
      parameters:
        - name: range
          in: query
          required: false
          schema: { type: string, enum: [1D, 1W, 3M, 1Y, YTD, 7D, 30D, 90D, ALL], default: 7D }
          description: |
            7D / 30D / 90D 为含今日的最近 N 个美东自然日；ALL 为全部。
            F22-a 新增（向后兼容）：1W = 7 天、3M = 90 天、1Y = 365 天、YTD = 当年 1 月 1 日（美东）起；
            1D = 日内快照（美东交易日 09:30–16:00 每 30 分钟一档），返回最近一个有日内快照的美东日期的各档，点带 at
      responses:
        "200":
          description: 资产趋势
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/AssetHistory" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /paper/orders:
    post:
      tags: [paper]
      operationId: createPaperOrder
      summary: 模拟下单（市价 / 限价，按虚拟行情撮合）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, orderType]
              properties:
                symbol: { type: string }
                side: { type: string, enum: [BUY, SELL] }
                orderType: { type: string, enum: [MARKET, LIMIT] }
                amount: { $ref: "#/components/schemas/Money" }
                quantity: { type: number, description: 股数，最多 6 位小数；限价单必填 }
                limitPrice: { type: number, description: 限价单必填，> 0 }
                timeInForce: { type: string, enum: [DAY] }
      responses:
        "200":
          description: 已受理（市价单即时成交）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [orderId, status]
                        properties:
                          orderId: { type: string }
                          status: { type: string, enum: [NEW, FILLED, CANCELED, REJECTED] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [paper]
      operationId: listPaperOrders
      summary: 模拟订单列表
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, CLOSED] }
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 模拟订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/PaperOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /paper/orders/{id}:
    get:
      tags: [paper]
      operationId: getPaperOrder
      summary: 模拟订单详情
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 模拟订单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PaperOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper/orders/{id}/cancel:
    post:
      tags: [paper]
      operationId: cancelPaperOrder
      summary: 撤销未成交的模拟订单
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已撤单
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string }
                          status: { type: string, enum: [CANCELED] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /paper/positions:
    get:
      tags: [paper]
      operationId: listPaperPositions
      summary: 模拟持仓（按虚拟行情估值）
      responses:
        "200":
          description: 模拟持仓
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, positions]
                        properties:
                          simulated: { type: boolean }
                          updatedAt: { type: string, format: date-time }
                          equityValue: { type: number }
                          positions:
                            type: array
                            items: { $ref: "#/components/schemas/Position" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────── 5.10 奖励 / XP（F22-e、F22-f，演示） ─────────────
  /rewards/xp:
    get:
      tags: [rewards]
      operationId: getXP
      summary: XP 余额与等级（F22-e）
      description: |
        新增接口，向后兼容。XP 为站内成长值（账本合计，初始 0），与券商资金、模拟盘、预测积分完全隔离，不可兑换现金。
        等级按 seed 门槛计算（GET /rewards/catalog 的 tiers）。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/XPBalance" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /rewards/catalog:
    get:
      tags: [rewards]
      operationId: getRewardsCatalog
      summary: Fifi 商店与任务 seed 配置（F22-e / F22-f）
      description: |
        新增接口，向后兼容。商品、套装、敬请期待、等级门槛与任务 XP 均为后端 seed 配置（构建期内嵌）；本期兑换未开放（App 详情弹层提示"兑换即将开启"）。
        image 为 App 内置素材名（placeholder=true 为占位图，高清图后续替换）；tasks 中 complianceReview=true 的任务上线前需合规审核。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RewardsCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /rewards/checkin:
    get:
      tags: [rewards]
      operationId: getCheckin
      summary: 今日签到状态、连续天数、本周七圆点（F22-f）
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckinStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [rewards]
      operationId: checkin
      summary: 每日签到（F22-f）
      description: |
        每个美东日期一次（主键防重复），首次入账 seed 中 checkin 任务的 XP（+10），返回 granted；同日重复调用不入账（无 granted），返回当前状态。
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/CheckinStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501": { $ref: "#/components/responses/NotEnabled" }

  # ───────────── 6. 文件与通知 ─────────────
  /documents:
    get:
      tags: [documents]
      operationId: listDocuments
      summary: 交易确认书 / 对账单 / 税务文件
      parameters:
        - name: type
          in: query
          schema: { type: string, enum: [TRADE_CONFIRM, STATEMENT, TAX] }
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [docId, type, title, date, url]
                          properties:
                            docId: { type: string }
                            type: { type: string, enum: [TRADE_CONFIRM, STATEMENT, TAX] }
                            title: { type: string }
                            period: { type: string }
                            date: { type: string, format: date }
                            url: { type: string, description: 短时效签名链接 }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      summary: 站内通知
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: 列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          required: [id, category, title, body, createdAt, read]
                          properties:
                            id: { type: string }
                            category: { type: string, enum: [VIOLATION, TRADE, FUNDS, ACCOUNT, SYSTEM] }
                            title: { type: string }
                            body: { type: string }
                            createdAt: { type: string, format: date-time }
                            read: { type: boolean }
                            deepLink: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /notifications/read:
    post:
      tags: [notifications]
      operationId: markNotificationsRead
      summary: 标记已读
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        "200": { $ref: "#/components/responses/OkEmpty" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  # ───────────── 5.9 预测板块（F19，积分演示版） ─────────────
  /predict/account:
    get:
      tags: [predict]
      operationId: getPredictAccount
      summary: 预测积分账户与战绩（首次访问自动创建，初始 10,000 分）
      description: 积分演示版：不涉及真实资金、券商账户与模拟盘账户（独立存储 predict_*）。
      responses:
        "200":
          description: 积分账户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, points, initialPoints, stats]
                        properties:
                          simulated: { type: boolean }
                          points: { type: integer }
                          initialPoints: { type: integer }
                          stats: { $ref: "#/components/schemas/PredictStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /predict/markets:
    get:
      tags: [predict]
      operationId: listPredictMarkets
      summary: 进行中的预测市场（15 分钟涨跌 + 事件）
      description: |
        updown：BTC / SOL 当前 15 分钟窗口（目标价 = 窗口创建时的虚拟行情价，到期按虚拟行情自动结算，结算过迟作废退回）；
        events：未截止的事件市场（后端种子数据，管理命令 cmd/predictctl 结算）。概率 = 该方向池 ÷ 两边池（含种子流动性）。
      parameters:
        - name: category
          in: query
          required: false
          schema: { type: string, enum: [ALL, CRYPTO, STOCKS, MACRO, SPORTS, TRENDING] }
      responses:
        "200":
          description: 市场列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, serverTime, updown, events]
                        properties:
                          simulated: { type: boolean }
                          serverTime: { type: string, format: date-time, description: 服务器时间（App 校准倒计时） }
                          updown: { type: array, items: { $ref: "#/components/schemas/PredictMarket" } }
                          events: { type: array, items: { $ref: "#/components/schemas/PredictMarket" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /predict/markets/{id}:
    get:
      tags: [predict]
      operationId: getPredictMarket
      summary: 单个预测市场
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 市场
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PredictMarket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /predict/bets:
    post:
      tags: [predict]
      operationId: placePredictBet
      summary: 下注（预测积分）
      description: |
        赔付简化模型：按下注时的比例定赔率，若正确可得 floor(stake ÷ p) 分（p 为所选方向概率，夹在 2%–98%）；下注后池子增加，比例随之变化。
        AMM / 订单簿定价留二期。stake 为整数 10–5,000 且不超过积分余额；市场截止后不可下注（40901）；积分不足 42201。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [marketId, outcome, stake]
              properties:
                marketId: { type: string }
                outcome: { type: string, enum: [YES, NO], description: 涨跌市场 YES = 上涨，NO = 下跌 }
                stake: { type: integer, minimum: 10, maximum: 5000 }
      responses:
        "200":
          description: 下注结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, bet, points, market]
                        properties:
                          simulated: { type: boolean }
                          bet: { $ref: "#/components/schemas/PredictBet" }
                          points: { type: integer }
                          market: { $ref: "#/components/schemas/PredictMarket" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
    get:
      tags: [predict]
      operationId: listPredictBets
      summary: 我的预测（最近 200 笔，含战绩）
      responses:
        "200":
          description: 下注列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, bets, stats]
                        properties:
                          simulated: { type: boolean }
                          bets: { type: array, items: { $ref: "#/components/schemas/PredictBet" } }
                          stats: { $ref: "#/components/schemas/PredictStats" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /predict/claim:
    post:
      tags: [predict]
      operationId: claimPredictPayouts
      summary: 领取全部已结算派彩（命中派彩、作废退回的本金）
      responses:
        "200":
          description: 领取结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [simulated, claimed, points]
                        properties:
                          simulated: { type: boolean }
                          claimed: { type: integer }
                          points: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Authorization: Bearer <sessionToken>（除 /auth/otp/*、/auth/oauth 外均必须）"

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, format: uuid }
      description: >-
        可选。App 为每笔资金类申请（入金、出金、下单）生成的 UUID；超时后重试同一笔申请时沿用同一个值。
        后端按"账户 + 该值"去重：已有记录时不再提交给券商，直接按原记录作答——已受理返回原 transferId / orderId 与状态；
        仍在确认中返回 502 / 50001（data 带原编号）；内容与原记录不同（金额、方向等）返回 42200。
        不带时由后端生成（兼容旧版 App）。
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
      description: 分页游标

  schemas:
    FundingLimits:
      type: object
      required: [minDeposit, maxDeposit, dailyDeposit, minWithdrawal, maxWithdrawal, minWire, maxBanks, seasoningDays, seasoningStart]
      properties:
        minDeposit: { $ref: "#/components/schemas/Money" }
        maxDeposit: { $ref: "#/components/schemas/Money" }
        dailyDeposit: { $ref: "#/components/schemas/Money" }
        minWithdrawal: { $ref: "#/components/schemas/Money" }
        maxWithdrawal: { $ref: "#/components/schemas/Money" }
        minWire: { $ref: "#/components/schemas/Money" }
        maxBanks: { type: integer }
        achCutoffET: { type: string, description: "ACH 截止时间（美东，示例值，待 DW 确认）" }
        wireCutoffET: { type: string, description: "电汇截止时间（美东，示例值，待 DW 确认）" }
        seasoningDays: { type: integer, description: "ACH 入金观察期天数（Q-DW-8e，展示用）" }
        seasoningStart: { type: string, enum: [CLEARED, INITIATED], description: "观察期起算点" }
    Envelope:
      type: object
      required: [code, message]
      properties:
        code: { type: integer, description: 0 表示成功 }
        message: { type: string }
        data: {}

    ErrorCode:
      type: integer
      description: |
        0 成功；40101 未登录 / token 无效；40102 会话过期或已注销（App → S-01 会话过期页）；
        40301 账户受限（附 restriction）；40901 状态冲突（在途资金禁止解绑、重复提交等）；
        42200 字段校验失败（附 fields[]）；42201 金额超限（附 limits）；42901 请求过于频繁（附 retryAfter）；
        50000 服务器内部错误；50001 DW 调用失败（对用户显示"稍后重试"，不透出 DW 原始错误）；
        50002 DW 返回数据异常（已记录，人工介入）；50003 功能暂未开通。
        注：HTTP 404（资源不存在）的业务错误码 api-spec.md 第 8 节尚未定义。
      enum: [0, 40101, 40102, 40301, 40901, 42200, 42201, 42901, 50000, 50001, 50002, 50003]

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { $ref: "#/components/schemas/ErrorCode" }
        message: { type: string, description: 可展示给用户的简体中文文案 }
        data:
          type: object
          nullable: true
          properties:
            fields:
              type: array
              description: 422xx 时的字段错误，文案与 P-03 校验一致
              items:
                type: object
                required: [field, reason]
                properties:
                  field: { type: string }
                  reason: { type: string }
            restriction:
              type: string
              enum: [FROZEN, OPEN_NO_NEW_TRADES]
              description: 40301 时的受限类型
            limits:
              type: object
              description: 42201 时返回的当前限额（示例值，待确认）
              additionalProperties: { type: number }

    LoginProvider:
      type: string
      enum: [EMAIL, GOOGLE, APPLE]

    ApplicationStatus:
      type: string
      enum: [NONE, DRAFT, SUBMITTED, APPROVED, DENIED]

    KycStatus:
      type: string
      description: 与 DW kyc.status.name 一致
      enum: [KYC_NOT_READY, KYC_READY, KYC_PROCESSING, KYC_INFO_REQUIRED, KYC_DOC_REQUIRED, KYC_MANUAL_REVIEW, KYC_APPROVED, KYC_DENIED]

    AccountStatus:
      type: string
      enum: [PENDING, OPEN, OPEN_NO_NEW_TRADES, FROZEN, CLOSED]

    DepositStatus:
      type: string
      description: DW Deposit Status。PROCESSING（编号 17）不在 DW 文档枚举中，沙盒实测入金创建后即返回（2026-11-19 新增）
      enum: [STARTED, PENDING, SUCCESSFUL, FAILED, RETURNED, APPROVED, REJECTED, ON_HOLD, PROCESSING]

    Money:
      type: number
      format: double
      minimum: 0
      multipleOf: 0.01
      description: 金额，USD，两位小数

    ApplicationData:
      type: object
      description: |
        开户资料，字段名与 pages.md P-03 数据字段一致（后端按 pages.md 3.1.2 映射为 DW documents；App 不感知 DW 字段名）。
        草稿阶段字段均可缺省；提交时由后端统一校验（422xx）。
      additionalProperties: true
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        citizenship: { type: string, description: ISO 3166-1 alpha-2 }
        taxResidency: { type: string }
        phone: { type: string }
        contactEmail: { type: string, format: email }
        language: { type: string }
        usTaxPayer: { type: string, enum: [YES, NO] }
        tinType: { type: string, enum: [SSN, ITIN, FOREIGN_TIN, NIN] }
        tin: { type: string, writeOnly: true, description: 只写；读取时后端返回打码值 }
        taxTreaty: { type: string, enum: [YES, NO] }
        irsBackup: { type: string, enum: [YES, NO] }
        tinConfirm: { type: boolean, description: 确认税号为本人报税使用的政府签发号码（P-03c，必填 true） }
        residentialAddress:
          type: object
          properties:
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            state: { type: string }
            postalCode: { type: string }
            country: { type: string }
        mailingAddress:
          type: object
          nullable: true
          additionalProperties: true
        employmentStatus: { type: string, enum: [EMPLOYED, SELF_EMPLOYED, UNEMPLOYED, RETIRED, STUDENT] }
        employerName: { type: string }
        occupation: { type: string, deprecated: true, description: 已停用（自由文本），改用 position；后端不再发送给 DW }
        industry:
          type: string
          description: 所属行业（DW EMPLOYMENT_INFO.type）；employmentStatus 为 EMPLOYED / SELF_EMPLOYED 时必填。中文名称见 pages.md 3.1.6
          enum: [AGRICULTURE, MINING, UTILITIES, CONSTRUCTION, MANUFACTURING, WHOLESALE, RETAIL, TRANSPORT, INFORMATION, FINANCE, REAL_ESTATE, PROFESSIONAL, MANAGEMENT, EDUCATION, HEALTH, ART, FOOD, PUBLIC, WASTE]
        position:
          type: string
          description: 职位（DW EMPLOYMENT_INFO.position），选填。中文名称见 pages.md 3.1.6
          enum: [ACCOUNTANT, ACTUARY, ADJUSTER, ADMINISTRATOR, ADVERTISER, AGENT, ATC, AMBASSADOR, ANALYST, APPRAISER, ARCHITECT, ARTIST, ASSISTANT, ATHLETE, ATTENDANT, ATTORNEY, AUCTIONEER, AUDITOR, BARBER, BROKER, BUSINESS_EXEC, BUSINESS_OWNER, CAREGIVER, CARPENTER, CASHIER, CHEF, CHIROPRACTOR, CIVIL, CLERGY, CLERK, COMPLIANCE, CONSULTANT, CONTRACTOR, COUNSELOR, CUSTOMER_SERVICE, DEALER, DEVELOPER, DISTRIBUTOR, DOCTOR, DRIVER, ENGINEER, EXAMINER, EXTERMINATOR, FACTORY, FARMER, FINANCIAL, FISHERMAN, FLIGHT, HR, IMPEX, INSPECTOR, INTERN, INVESTMENT, INVESTOR, IT, JANITOR, JEWELER, LABORER, LANDSCAPER, LENDING, MANAGER, MECHANIC, MILITARY, MORTICIAN, NURSE, NUTRITIONIST, OFFICE, PHARMACIST, PHYSICAL, PILOT, POLICE, POLITICIAN, PM, REP, RESEARCHER, SAILOR, SALES, SCIENTIST, SEAMSTRESS, SECURITY, SOCIAL, TEACHER, TECHNICIAN, TELLER, TRADESPERSON, TRAINER, TRANSPORTER, UNDERWRITER, WRITER]
        annualIncomeRange: { type: string }
        netWorthRange: { type: string }
        netWorthLiquidRange: { type: string }
        investmentExperience: { type: string }
        investmentObjective: { type: string }
        riskTolerance: { type: string }
        fundingSources:
          type: array
          description: 对应 DW COMPLIANCE_AML_INFO.fundingSources，取值与 DW 一一对应（2026-11-19 用户决定；沙盒已验证 EMP）
          items: { type: string, enum: [EMP, SAVINGS, INVESTMENT, GIFT, RETIRE, FAMILY, SALE, RENT] }
        isAffiliatedBD: { type: boolean }
        affiliatedFirmName: { type: string }
        affiliatedAck: { type: boolean, description: 已了解向雇主报备要求（isAffiliatedBD=true 时必填 true） }
        isPEP: { type: boolean }
        pepName: { type: string }
        pepCountry: { type: string, description: ISO 3166-1 alpha-2 }
        pepRoles:
          type: array
          items:
            type: object
            properties:
              role: { type: string, description: 职务及任职年份（可为自由文本） }
              startYear: { type: integer }
              endYear: { type: integer }
        isControlPerson: { type: boolean }
        controlCompanyName: { type: string }
        controlCompanySymbol: { type: string }
        accountType: { type: string, enum: [LIVE], description: 首期固定 }
        tradingType: { type: string, enum: [CASH], description: 首期固定 }
        accountManagementType: { type: string, enum: [SELF], description: 首期固定 }

    DisclosureAck:
      type: object
      required: [id, accepted]
      properties:
        id:
          type: string
          description: DW 披露 termsOfUse / customerAgreement / marketDataAgreement / privacyPolicy / dataSharing / rule14b / extendedHoursAgreement，或平台条款 id
        source: { type: string, enum: [DW, PARTNER] }
        version: { type: string }
        accepted: { type: boolean, description: rule14b 时表示用户的选择 }
        acceptedAt: { type: string, format: date-time }

    BankAccount:
      type: object
      required: [id, mask, status]
      properties:
        id: { type: string }
        bankName: { type: string }
        mask: { type: string, pattern: "^[0-9]{4}$" }
        type: { type: string, enum: [CHECKING, SAVINGS] }
        ownerName: { type: string }
        nickname: { type: string, description: 用户填写的备注名；DW 不返回银行名称时用于显示（新增字段） }
        status: { type: string }
        createdAt: { type: string, format: date-time }

    BankLinkDirect:
      type: object
      description: 方案 A（bank_link_method=DIRECT）
      required: [accountNumber, routingNumber, type]
      properties:
        accountNumber: { type: string, writeOnly: true }
        routingNumber: { type: string, writeOnly: true }
        type: { type: string, enum: [CHECKING, SAVINGS] }
        nickname: { type: string }

    BankLinkPlaid:
      type: object
      description: 方案 B（bank_link_method=PLAID）
      required: [plaidProcessorToken]
      properties:
        plaidProcessorToken: { type: string, writeOnly: true }

    Quote:
      type: object
      required: [symbol, last, chg, chgPct, bid, ask]
      properties:
        symbol: { type: string }
        last: { type: number }
        chg: { type: number, description: 相对昨收的涨跌额 }
        chgPct: { type: number, description: 涨跌幅（百分数） }
        bid: { type: number }
        ask: { type: number }

    Transfer:
      type: object
      required: [transferId, type, method, amount, status, submittedAt]
      properties:
        transferId: { type: string }
        type: { type: string, enum: [DEPOSIT, WITHDRAWAL] }
        method: { type: string, enum: [ACH, WIRE] }
        amount: { $ref: "#/components/schemas/Money" }
        status:
          type: string
          description: |
            入金按 DepositStatus；出金按 DW Redemption Status（STARTED / PENDING / SUCCESSFUL / FAILED / OTHER / RIA_* / APPROVED / REJECTED / ON_HOLD；Q-DW-8d 复核）。
            我方新增 SUBMITTING：已记录、正在提交给 DW 或提交结果待确认（新增取值）。
            我方新增 UNCONFIRMED：券商结果待人工核对（对账重放被拒、超过幂等有效期仍未查到；新增取值，2026-11-21）。
        failureReason: { type: string, nullable: true, description: 可展示的中文原因（不透出 DW 原文） }
        submittedAt: { type: string, format: date-time }
        doneAt: { type: string, format: date-time, nullable: true }
        bankAccountId: { type: string, nullable: true, description: 关联的银行账户（WIRE 出金为空；新增字段） }
        buyingPowerAvailableAt: { type: string, format: date-time, nullable: true, description: 入金的购买力可用日（DW seasoningDetails.depositBuyingPowerHoldExpires；新增字段） }
        withdrawableAt: { type: string, format: date-time, nullable: true, description: 入金的可提现日（DW seasoningDetails.seasoningPeriodExpires；新增字段） }

    OrderStatus:
      type: string
      description: DW Order Status；SUBMITTING、UNCONFIRMED 为我方取值（已记录、提交结果待确认 / 券商结果待人工核对，不能撤单）
      enum: [SUBMITTING, NEW, PARTIAL_FILL, FILLED, REJECTED, CANCELED, PENDING_CANCEL, UNCONFIRMED]

    Order:
      type: object
      required: [orderId, symbol, side, orderType, status, submittedAt, updatedAt]
      properties:
        orderId: { type: string }
        orderNo: { type: string, nullable: true, description: DW 订单号 }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        orderType: { type: string, enum: [MARKET, LIMIT] }
        limitPrice: { type: number, nullable: true, description: 限价（限价单） }
        timeInForce: { type: string, nullable: true, enum: [DAY], description: 有效期（限价单） }
        quantity: { type: number, nullable: true, description: 委托股数（按股数下单时） }
        amount: { type: number, nullable: true, description: 委托金额（按金额下单时） }
        status: { $ref: "#/components/schemas/OrderStatus" }
        filledQty: { type: number, nullable: true, description: DW cumulativeQuantity }
        avgPrice: { type: number, nullable: true, description: DW averagePrice }
        totalAmount: { type: number, nullable: true, description: DW totalOrderAmount }
        fees: { type: number, nullable: true, description: DW fees }
        rejectReason: { type: string, nullable: true, description: 可展示的中文原因（不透出 DW 原文） }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        doneAt: { type: string, format: date-time, nullable: true }

    Position:
      type: object
      required: [symbol, quantity, sellableQty]
      properties:
        symbol: { type: string }
        quantity: { type: number, description: DW openQty }
        sellableQty: { type: number, description: DW availableForTradingQty }
        avgPrice: { type: number, description: DW avgPrice }
        costBasis: { type: number, description: DW costBasis }
        marketPrice: { type: number, description: DW mktPrice }
        marketValue: { type: number, description: DW marketValue }
        unrealizedPL: { type: number, description: DW unrealizedPL }
        unrealizedDayPL: { type: number, description: DW unrealizedDayPL }

    PredictText:
      type: object
      required: [zh, en]
      properties:
        zh: { type: string }
        en: { type: string }
    PredictMarket:
      type: object
      description: 预测市场（F19 积分演示版）
      required: [id, kind, category, title, subtitle, outcomes, opensAt, closesAt, status]
      properties:
        id: { type: string }
        kind: { type: string, enum: [UPDOWN, EVENT] }
        category: { type: string, enum: [CRYPTO, STOCKS, MACRO, SPORTS, TRENDING] }
        symbol: { type: string, nullable: true, description: 涨跌市场标的（BTC / SOL，虚拟行情） }
        title: { $ref: "#/components/schemas/PredictText" }
        subtitle: { $ref: "#/components/schemas/PredictText" }
        outcomes:
          type: array
          description: 固定 2 条：YES、NO
          items:
            type: object
            required: [key, label, percent, pool]
            properties:
              key: { type: string, enum: [YES, NO] }
              label: { $ref: "#/components/schemas/PredictText" }
              percent: { type: integer, description: 概率百分比，两边合计 100 }
              pool: { type: integer, description: 该方向池（含种子流动性） }
        opensAt: { type: string, format: date-time }
        closesAt: { type: string, format: date-time }
        targetPrice: { type: number, nullable: true }
        settlePrice: { type: number, nullable: true }
        status: { type: string, enum: [OPEN, CLOSED, SETTLED] }
        result: { type: string, nullable: true, enum: [YES, NO, VOID] }
    PredictBet:
      type: object
      required: [id, marketId, outcome, stake, probability, potentialPayout, status, payout, claimed, createdAt]
      properties:
        id: { type: string }
        marketId: { type: string }
        outcome: { type: string, enum: [YES, NO] }
        stake: { type: integer }
        probability: { type: number, description: 下注时所选方向的概率（0–1） }
        potentialPayout: { type: integer, description: 若正确可得（含本金） }
        status: { type: string, enum: [OPEN, WON, LOST, VOID] }
        payout: { type: integer }
        claimed: { type: boolean }
        createdAt: { type: string, format: date-time }
        settledAt: { type: string, format: date-time, nullable: true }
        market: { allOf: [{ $ref: "#/components/schemas/PredictMarket" }], nullable: true }
    PredictStats:
      type: object
      required: [settled, wins, hitRate, netPoints, claimable, openBets, openStake]
      properties:
        settled: { type: integer, description: 已结算笔数（不含作废） }
        wins: { type: integer }
        hitRate: { type: number, description: 命中率（百分数，一位小数） }
        netPoints: { type: integer, description: 累计盈亏分（已结算：派彩 − 本金） }
        claimable: { type: integer }
        openBets: { type: integer }
        openStake: { type: integer }
    Allocation:
      type: object
      description: 资产分布（F17）
      required: [simulated, total, items, updatedAt]
      properties:
        simulated: { type: boolean, description: 模拟盘为 true }
        total: { $ref: "#/components/schemas/Money" }
        items:
          type: array
          description: 固定 3 条，顺序 STOCK、ETF、CASH
          items:
            type: object
            required: [type, amount, pct]
            properties:
              type: { type: string, enum: [STOCK, ETF, CASH] }
              amount: { $ref: "#/components/schemas/Money" }
              pct: { type: number, description: 占比（百分数，一位小数，如 45.0） }
        updatedAt: { type: string, format: date-time }
    AssetHistory:
      type: object
      description: 资产趋势（F17，每日资产快照）
      required: [simulated, range, points]
      properties:
        simulated: { type: boolean }
        range: { type: string, enum: [1D, 1W, 3M, 1Y, YTD, 7D, 30D, 90D, ALL] }
        points:
          type: array
          description: 按日期升序
          items:
            type: object
            required: [date, total, cash, stock, etf]
            properties:
              date: { type: string, format: date, description: 美东日期 }
              at: { type: string, format: date-time, description: 仅 range=1D：日内档位时刻（UTC）（F22-a） }
              total: { $ref: "#/components/schemas/Money" }
              cash: { $ref: "#/components/schemas/Money" }
              stock: { $ref: "#/components/schemas/Money" }
              etf: { $ref: "#/components/schemas/Money" }
    XPBalance:
      type: object
      required: [balance, tier]
      properties:
        balance: { type: integer, description: XP 余额（账本合计） }
        tier: { type: integer }
        nextTier: { type: integer, description: 已是最高级时省略 }
        nextTierMinXp: { type: integer }
    RewardsCatalog:
      type: object
      required: [tiers, items, bundles, comingSoon, tasks]
      properties:
        tiers:
          type: array
          items: { type: object, required: [tier, minXp], properties: { tier: { type: integer }, minXp: { type: integer } } }
        items: { type: array, items: { $ref: "#/components/schemas/RewardItem" } }
        bundles: { type: array, items: { $ref: "#/components/schemas/RewardItem" } }
        comingSoon: { type: array, items: { $ref: "#/components/schemas/RewardItem" } }
        tasks:
          type: array
          items:
            type: object
            required: [id, xp, enabled]
            properties:
              id: { type: string, enum: [checkin, lesson, checkup, savings, share] }
              xp: { type: integer }
              enabled: { type: boolean }
              complianceReview: { type: boolean }
    RewardItem:
      type: object
      required: [id, unlockTier, image, name]
      properties:
        id: { type: string }
        tier: { type: integer, description: 所在等级页签 }
        unlockTier: { type: integer }
        xp: { type: integer }
        image: { type: string, description: App 内置素材名；空字符串 = 待配图（按 color 显示纯色占位） }
        placeholder: { type: boolean }
        color: { type: string, description: 待配图时的纯色占位（#RRGGBB），可选 }
        name: { type: object, required: [zh, en], properties: { zh: { type: string }, en: { type: string } } }
        desc: { type: object, properties: { zh: { type: string }, en: { type: string } } }
    CheckinStatus:
      type: object
      required: [today, checkedIn, streak, week, resetAt, xp, balance]
      properties:
        today: { type: string, format: date, description: 美东日期 }
        checkedIn: { type: boolean }
        streak: { type: integer, description: 连续签到天数（今日未签时截至昨日） }
        week: { type: array, minItems: 7, maxItems: 7, items: { type: boolean }, description: 本周一至周日（美东）是否已签 }
        resetAt: { type: string, format: date-time, description: 下一个美东零点 }
        xp: { type: integer, description: 签到奖励 }
        granted: { type: integer, description: 仅 POST 首次签到：本次入账 }
        balance: { type: integer }
    PaperAccount:
      type: object
      required: [simulated, initialCash, cash, reservedCash, buyingPower, positionsValue, totalValue, totalPL]
      properties:
        simulated: { type: boolean, description: 恒为 true }
        initialCash: { type: number }
        cash: { type: number, description: 现金（含限价买单冻结部分） }
        reservedCash: { type: number, description: 限价买单冻结金额 }
        buyingPower: { type: number, description: 可用资金 = cash − reservedCash }
        positionsValue: { type: number, description: 模拟持仓市值（虚拟行情） }
        totalValue: { type: number }
        totalPL: { type: number, description: totalValue − initialCash }
        totalPLPct: { type: number, description: 百分数 }
        resetAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    PaperOrder:
      type: object
      required: [orderId, symbol, side, orderType, status, submittedAt, updatedAt, simulated]
      properties:
        orderId: { type: string }
        orderNo: { type: string, nullable: true }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        orderType: { type: string, enum: [MARKET, LIMIT] }
        quantity: { type: number, nullable: true }
        amount: { type: number, nullable: true }
        limitPrice: { type: number, nullable: true }
        timeInForce: { type: string, enum: [DAY] }
        status: { type: string, enum: [NEW, FILLED, CANCELED, REJECTED] }
        filledQty: { type: number, nullable: true }
        avgPrice: { type: number, nullable: true }
        totalAmount: { type: number, nullable: true }
        fees: { type: number }
        rejectReason: { type: string, nullable: true, description: 撤销 / 过期原因 }
        submittedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        doneAt: { type: string, format: date-time, nullable: true }
        simulated: { type: boolean }

  responses:
    OkEmpty:
      description: 成功（无数据）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Envelope" }
    Unauthorized:
      description: 401xx 未登录 / 会话过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Restricted:
      description: 40301 账户受限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 资源不存在（业务错误码待 api-spec.md 补充）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Conflict:
      description: 40901 状态冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationError:
      description: 42200 字段校验失败 / 42201 金额超限
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 42901 请求过于频繁（如验证码限频；data.retryAfter 为秒数）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InternalError:
      description: 50000 服务器内部错误
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotEnabled:
      description: 50003 功能暂未开通
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    DWError:
      description: 50001 DW 调用失败 / 50002 DW 返回数据异常（不透出 DW 原始错误）
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
